<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>声望与金币 · 图标预览</title>
<style>
@font-face{font-family:game;src:url('../zcool_kuail.ttf')}
*{box-sizing:border-box}body{margin:0;background:#f5ecd9;color:#5b3b20;font:16px game,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px}
h1{font-size:26px;margin:0 0 8px}p{margin:0 0 22px;color:#876b47}
.hero{display:flex;gap:24px;margin-bottom:24px}.asset{border-radius:16px;background:#fff8e9;border:1px solid #dfc9a3;flex:1;text-align:center;padding:16px}.asset img{width:170px;height:170px;object-fit:contain}.asset div{font-size:20px;margin-top:8px}
.scene{height:310px;position:relative;border-radius:16px;overflow:hidden;background:url('../../maps/restaurant_map.png') center 40%/cover}.hud{position:absolute;left:24px;top:22px;display:flex;gap:12px}.counter{display:flex;align-items:center;gap:8px;background:#fff4dcee;border:2px solid #876b47;border-radius:12px;padding:4px 14px 4px 6px;box-shadow:0 3px 0 #5b3b2033;font-size:24px}.counter img{width:48px;height:48px}.caption{position:absolute;right:16px;bottom:12px;background:#fff4dcee;border-radius:6px;padding:7px 10px;font-size:14px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.size{padding:16px;background:#fff8e9;border:1px solid #dfc9a3;border-radius:12px}.row{display:flex;align-items:center;gap:12px;margin-top:12px}.dark{background:#463528;padding:10px;border-radius:8px;color:#fff4dc}.size span{min-width:55px}
footer{font:13px system-ui;color:#876b47;margin-top:20px}
</style>
<main><h1>声望与金币</h1><p>暖色手绘 · 深棕描边 · 透明背景</p>
<div class="hero"><div class="asset"><img src="reputation.png" alt="橙金星形声望徽章"><div>声望</div></div><div class="asset"><img src="gold.png" alt="菱形压纹金币"><div>金币</div></div></div>
<div class="scene"><div class="hud"><div class="counter"><img src="reputation.png" alt="声望">128</div><div class="counter"><img src="gold.png" alt="金币">2,560</div></div><div class="caption">左上角排列示意 · 数值为示例</div></div>
<div class="sizes"><div class="size">32 像素 · 实际显示尺寸<div class="row"><img src="reputation.png" width="32" height="32" alt="声望"><span>128</span><img src="gold.png" width="32" height="32" alt="金币"><span>2,560</span></div><div class="row dark"><img src="reputation.png" width="32" height="32" alt="声望"><span>128</span><img src="gold.png" width="32" height="32" alt="金币"><span>2,560</span></div></div><div class="size">40 像素 · 实际显示尺寸<div class="row"><img src="reputation.png" width="40" height="40" alt="声望"><span>128</span><img src="gold.png" width="40" height="40" alt="金币"><span>2,560</span></div><div class="row dark"><img src="reputation.png" width="40" height="40" alt="声望"><span>128</span><img src="gold.png" width="40" height="40" alt="金币"><span>2,560</span></div></div><div class="size">48 像素 · 实际显示尺寸<div class="row"><img src="reputation.png" width="48" height="48" alt="声望"><span>128</span><img src="gold.png" width="48" height="48" alt="金币"><span>2,560</span></div><div class="row dark"><img src="reputation.png" width="48" height="48" alt="声望"><span>128</span><img src="gold.png" width="48" height="48" alt="金币"><span>2,560</span></div></div></div>
<footer>设计预览，尚未接入游戏。建议显示尺寸 40–48 像素，保持等比缩放。</footer></main></html>
